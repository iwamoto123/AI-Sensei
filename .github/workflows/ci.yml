name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Supabase 未接続でも next build が落ちないようダミー（実装後は Repository variables で上書き推奨）
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Marp CLI（スモーク）
        run: npm run marp:smoke

      - name: Next.js build
        run: npm run build

  # Phase 6 以降: Playwright + ffmpeg による E2E / 動画パイプをここに追加
  # 例: 別ジョブで playwright install --with-deps && npx playwright test
